<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa sản phẩm - Admin GearHouse</title>
    <link rel="stylesheet" href="AdminMember.css">
    <link rel="stylesheet" href="AdminProduct.css">
</head>

<body>
    <div class="container">
        <nav class="sidebar">
            <h1 class="logo">GearHouse<br>Admin.</h1>
            <a href="AdminMember.html" class="item"><img src="images/users.png" alt=""> Quản lý Thành viên</a>
            <a href="AdminProduct.html" class="item active"><img src="images/box.png" alt=""> Quản lý Sản phẩm</a>
            <a href="Home.html" class="item home"><img src="images/home.png" alt=""> Về Trang chủ</a>
        </nav>
        <main class="main">
            <header class="header">
                <h2>Sửa sản phẩm</h2>
                <div class="user">
                    <span>Admin</span>
                    <img class="avatar" src="images/avatar.png" alt="Admin">
                </div>
            </header>
            <section class="box form-box">
                // Có chọn file ảnh nên phải dùng POST và enctype="multipart/form-data"
                <form method="POST" action="" enctype="multipart/form-data" onsubmit="return kiemtra()">
                    // Sau này ASP sẽ lấy id bằng Request.QueryString.Get("id") rồi điền dữ liệu từ database vào các ô -->
                    <input type="hidden" name="id" value="1">
                    <label>Tên sản phẩm</label>
                    <input type="text" name="ten" id="inTen" value="Bàn phím cơ Logitech G Pro X"
                        placeholder="Ví dụ: Bàn phím cơ Logitech G Pro X">
                    <label>Danh mục</label>
                    <input type="text" name="danhmuc" id="inDanhmuc" value="Bàn phím" placeholder="Ví dụ: Bàn phím">
                    <label>Giá bán (đ)</label>
                    <input type="text" name="gia" id="inGia" value="2990000" placeholder="Chỉ nhập số, ví dụ: 2990000">
                    <label>Số lượng trong kho</label>
                    <input type="text" name="kho" id="inKho" value="50" placeholder="Nhập 0 nếu hết hàng">
                    <label>Chọn ảnh mới (bỏ trống nếu giữ ảnh cũ)</label>
                    <input type="file" name="anh" id="inAnh" accept="image/*">
                    <p class="loi" id="loi"></p>
                    <div class="form-btn">
                        <a class="btn-huy" href="AdminProduct.html">Hủy</a>
                        <button class="btn-luu" type="submit">Lưu</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
    <script src="FormProduct.js"></script>
</body>

</html>
