<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý thành viên - Admin GearHouse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="AdminMember.css">
</head>

<body onload="hienthi(danhsach)">
    <div class="container">
        <nav class="sidebar">
            <h1 class="logo">GearHouse.<br>Admin</h1>
            <a href="#" id="menu1" class="item active" onclick="chonmenu(this)"><img src="images/users.png" alt=""> Quản
                lý Thành viên</a>
            <a href="#" id="menu2" class="item" onclick="chonmenu(this)"><img src="images/box.png" alt=""> Quản lý Sản
                phẩm</a>
            <a href="#" class="item home"><img src="images/home.png" alt=""> Về Trang chủ</a>
        </nav>
        <main class="main">
            <header class="header">
                <h2>Thành viên</h2>
                <div class="user">
                    <span>Admin</span>
                    <img class="avatar" src="images/avatar.png" alt="Admin">
                </div>
            </header>
            <section class="box">
                <div class="top">
                    <div class="search">
                        <img src="images/search.png" alt="">
                        <input type="text" id="searchInput" onkeyup="timkiem()" placeholder="Tìm kiếm tên, email...">
                    </div>
                    <button class="add-btn" onclick="them()"><img src="images/plus.png" alt=""> Thêm thành viên</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Họ tên</th>
                            <th>Email</th>
                            <th>Vai trò</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="memberBody"></tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="AdminMember.js"></script>
</body>

</html>
