<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý thành viên - Admin GearHouse</title>
    <link rel="stylesheet" href="../css/AdminMember.css">
</head>

<body>
    <div class="container">
        <nav class="sidebar">
            <h1 class="logo">GearHouse<br>Admin.</h1>
            <a href="../html/AdminMember.html" class="item active"><img src="../assets/images/users.png" alt=""> Quản lý Thành viên</a>
            <a href="../html/AdminProduct.html" class="item"><img src="../assets/images/box.png" alt=""> Quản lý Sản phẩm</a>
            <a href="../html/Home.html" class="item home"><img src="../assets/images/home.png" alt=""> Về Trang chủ</a>
        </nav>
        <main class="main">
            <header class="header">
                <h2>Thành viên</h2>
                <div class="user">
                    <span>Admin</span>
                    <img class="avatar" src="../assets/images/avatar.png" alt="Admin">
                </div>
            </header>
            <section class="box">
                <div class="top">
                    <form class="search" onsubmit="return false;">
                        <img src="../assets/images/search.png" alt="">
                        <input type="text" id="searchInput" onkeyup="timkiem()" placeholder="Tìm kiếm tên, email...">
                    </form>
                    <a href="../html/AddMember.html" class="add-btn"><img src="../assets/images/plus.png" alt=""> Thêm thành viên</a>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Họ tên</th>
                            <th>Email</th>
                            <th>Vai trò</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="memberBody"></tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="../js/AdminMember.js"></script>
</body>

</html>
